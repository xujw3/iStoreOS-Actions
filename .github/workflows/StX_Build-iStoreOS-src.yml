name: 💿 StX_Build-iStoreOS-src

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "1、请输入设备型号（见 config/openwrt_boards.txt）"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: string
      openwrt_kernel:
        description: "2、请选择内核版本"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核-未匹配则自动"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      openwrt_board: ${{ steps.prepare.outputs.openwrt_board }}
      openwrt_kernel: ${{ steps.prepare.outputs.openwrt_kernel }}
      auto_kernel: ${{ steps.prepare.outputs.auto_kernel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: ⚙️ 读取构建配置和输入默认值
        id: prepare
        run: |
          VERSION=$(grep '^VERSION=' .github/build-config.env | cut -d= -f2-)
          OPENWRT_BOARD="${{ inputs.openwrt_board }}"
          OPENWRT_KERNEL="${{ inputs.openwrt_kernel }}"
          AUTO_KERNEL="${{ inputs.auto_kernel }}"

          [ -n "$OPENWRT_BOARD" ] || OPENWRT_BOARD="s905d_s905x3_s912_s922x-ct2000"
          [ -n "$OPENWRT_KERNEL" ] || OPENWRT_KERNEL="6.6.y"
          [ -n "$AUTO_KERNEL" ] || AUTO_KERNEL="true"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "openwrt_board=$OPENWRT_BOARD" >> "$GITHUB_OUTPUT"
          echo "openwrt_kernel=$OPENWRT_KERNEL" >> "$GITHUB_OUTPUT"
          echo "auto_kernel=$AUTO_KERNEL" >> "$GITHUB_OUTPUT"

  pack:
    needs: prepare
    uses: ./.github/workflows/_Pack-iStoreOS.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      openwrt_board: ${{ needs.prepare.outputs.openwrt_board }}
      openwrt_kernel: ${{ needs.prepare.outputs.openwrt_kernel }}
      auto_kernel: ${{ needs.prepare.outputs.auto_kernel == 'true' }}
      rootfs_url: https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz
      package_action: kwonelee
      release_tag: iStoreOS-${{ needs.prepare.outputs.version }}-SNAPSHOT-dhcp
      release_body: |
        🔄 版本： iStoreOS-${{ needs.prepare.outputs.version }}-SNAPSHOT（源码编译后构建，插件集成适度精简）

        📂 来源： https://github.com/istoreos/istoreos

        🧠 内核： Please Login to iStoreOS → System → Amlogic Service → Replace the Kernel

        🧩 集成： 包含了基础系统组件、驱动、网络工具、容器支持、LuCI界面及插件等

        👤 用户名： root

        🔒 密码： 无

        🌐 IP： 单网口-动态获取（从上级路由找寻）；多网口-IP：192.168.100.1
    secrets: inherit
