name: 💿 St2_Build-iStoreOS-ib

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "1、请输入设备型号（见 config/openwrt_boards.txt）"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: string
      openwrt_kernel:
        description: "2、请选择内核版本"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核-未匹配则自动"
        required: false
        default: true
        type: boolean
      openwrt_rootfs:
        description: "3、请选择Rootfs通用底包（先确保St1有执行）"
        required: true
        default: "RELEASE"
        type: choice
        options:
          - RELEASE
      network_settings:
        description: "4、请选择初始网络配置（先确保St1有执行）"
        required: true
        default: "dhcp"
        type: choice
        options:
          - static
          - dhcp

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      openwrt_board: ${{ steps.prepare.outputs.openwrt_board }}
      openwrt_kernel: ${{ steps.prepare.outputs.openwrt_kernel }}
      auto_kernel: ${{ steps.prepare.outputs.auto_kernel }}
      openwrt_rootfs: ${{ steps.prepare.outputs.openwrt_rootfs }}
      network_settings: ${{ steps.prepare.outputs.network_settings }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: ⚙️ 读取构建配置和输入默认值
        id: prepare
        run: |
          VERSION=$(grep '^VERSION=' .github/build-config.env | cut -d= -f2-)
          OPENWRT_BOARD="${{ inputs.openwrt_board }}"
          OPENWRT_KERNEL="${{ inputs.openwrt_kernel }}"
          AUTO_KERNEL="${{ inputs.auto_kernel }}"
          OPENWRT_ROOTFS="${{ inputs.openwrt_rootfs }}"
          NETWORK_SETTINGS="${{ inputs.network_settings }}"

          [ -n "$OPENWRT_BOARD" ] || OPENWRT_BOARD="s905d_s905x3_s912_s922x-ct2000"
          [ -n "$OPENWRT_KERNEL" ] || OPENWRT_KERNEL="6.6.y"
          [ -n "$AUTO_KERNEL" ] || AUTO_KERNEL="true"
          [ -n "$OPENWRT_ROOTFS" ] || OPENWRT_ROOTFS="RELEASE"
          [ -n "$NETWORK_SETTINGS" ] || NETWORK_SETTINGS="dhcp"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "openwrt_board=$OPENWRT_BOARD" >> "$GITHUB_OUTPUT"
          echo "openwrt_kernel=$OPENWRT_KERNEL" >> "$GITHUB_OUTPUT"
          echo "auto_kernel=$AUTO_KERNEL" >> "$GITHUB_OUTPUT"
          echo "openwrt_rootfs=$OPENWRT_ROOTFS" >> "$GITHUB_OUTPUT"
          echo "network_settings=$NETWORK_SETTINGS" >> "$GITHUB_OUTPUT"

  pack:
    needs: prepare
    uses: ./.github/workflows/_Pack-iStoreOS.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      openwrt_board: ${{ needs.prepare.outputs.openwrt_board }}
      openwrt_kernel: ${{ needs.prepare.outputs.openwrt_kernel }}
      auto_kernel: ${{ needs.prepare.outputs.auto_kernel == 'true' }}
      rootfs_url: https://github.com/${{ github.repository }}/releases/download/iStoreOS-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.openwrt_rootfs }}-${{ needs.prepare.outputs.network_settings }}/istoreos-armsr-armv8-generic-rootfs.tar.gz
      package_action: ophub
      release_tag: iStoreOS-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.openwrt_rootfs }}-${{ needs.prepare.outputs.network_settings }}
    secrets: inherit
